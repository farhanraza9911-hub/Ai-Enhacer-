name: Publish face model

# Ek dafa chalayein: Actions tab -> "Publish face model" -> Run workflow.
# GFPGAN v1.4 (Apache-2.0, TencentARC) ONNX download karta hai, weights ko fp16 mein store kar ke file aadhi karta hai
# (load par ONNX Runtime wapas fp32 bana leta hai, output same), phir is repo ke release "models-v1" par upload karta hai.
# App ye file user ki ijazat se download karti hai.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download GFPGAN 1.4 ONNX (facefusion-assets mirror)
        run: |
          curl -fL --retry 3 -o gfpgan_1.4.onnx \
            https://github.com/facefusion/facefusion-assets/releases/download/models-3.0.0/gfpgan_1.4.onnx
          ls -l gfpgan_1.4.onnx
          # Source file ka hash: sirf record ke liye
          sha256sum gfpgan_1.4.onnx

      - name: Convert weights to fp16 storage
        run: |
          pip install onnx numpy onnxruntime opencv-python-headless
          python tools/make_fp16.py gfpgan_1.4.onnx gfpgan_1.4_fp16w.onnx
          ls -l gfpgan_1.4_fp16w.onnx
          # Sanity: model load ho aur 512x512 par chal jaye
          python - <<'PY'
          import onnxruntime as ort, numpy as np
          s = ort.InferenceSession("gfpgan_1.4_fp16w.onnx", providers=["CPUExecutionProvider"])
          y = s.run(None, {"input": np.zeros((1,3,512,512), np.float32)})[0]
          assert y.shape == (1,3,512,512) and np.isfinite(y).all()
          print("model OK", y.shape)
          PY
          sha256sum gfpgan_1.4_fp16w.onnx | tee gfpgan_1.4_fp16w.onnx.sha256

      - name: Create / update release models-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models-v1 >/dev/null 2>&1 || gh release create models-v1 \
            --title "Models v1 (GFPGAN 1.4, fp16 weights)" \
            --notes "GFPGAN v1.4 (Apache-2.0, TencentARC) as ONNX with fp16-stored weights. Downloaded by the AI Enhancer app with the user's consent for on-device face restoration."
          gh release upload models-v1 gfpgan_1.4_fp16w.onnx gfpgan_1.4_fp16w.onnx.sha256 --clobber
