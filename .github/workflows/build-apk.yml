name: Build APK

# GitHub ke server par APK banata hai. Apne computer par Android Studio ki zaroorat nahi.
# Chalane ka tareeqa: repo ke "Actions" tab -> "Build APK" -> "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download ncnn (prebuilt, Vulkan) agar repo mein nahi hai
        run: |
          if [ ! -d app/src/main/cpp/ncnn/arm64-v8a ]; then
            curl -fL -o ncnn.zip https://github.com/Tencent/ncnn/releases/download/20240820/ncnn-20240820-android-vulkan.zip
            unzip -q ncnn.zip
            mkdir -p app/src/main/cpp/ncnn
            for abi in arm64-v8a armeabi-v7a; do
              cp -r ncnn-20240820-android-vulkan/$abi app/src/main/cpp/ncnn/
            done
          fi
          ls app/src/main/cpp/ncnn/arm64-v8a/lib | head

      - name: Install Android SDK parts (NDK, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AIEnhancer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
